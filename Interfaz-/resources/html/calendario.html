<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPHOS · Calendario</title><link rel="stylesheet" href="../css/uphos.css"><link rel="stylesheet" href="../css/workspace.css"><link rel="stylesheet" href="../css/calendar.css"><script src="../js/preferences.js"></script><script type="module" src="../js/calendar.js"></script></head>
<body class="workspace calendar-page">
<header class="calendar-topbar"><div class="calendar-brand"><span class="calendar-brand-icon"><i class="fa-regular fa-calendar" aria-hidden="true"></i></span><div><h1>Calendario</h1><span>Organiza tu día con UPHOS</span></div></div><div class="calendar-navigation"><button id="calendar-today" class="secondary-button">Hoy</button><button id="calendar-previous" class="icon-button" aria-label="Periodo anterior">‹</button><button id="calendar-next" class="icon-button" aria-label="Periodo siguiente">›</button><h2 id="calendar-period" aria-live="polite"></h2></div><button id="calendar-create-mobile" class="primary-button" aria-label="Crear evento">+</button><label class="view-control"><span class="sr-only">Vista del calendario</span><select id="calendar-view"><option value="month">Mes</option><option value="week">Semana</option><option value="agenda">Agenda</option></select></label></header>
<div class="calendar-layout"><aside class="calendar-sidebar"><button id="calendar-create" class="primary-button"><i class="fa-solid fa-plus" aria-hidden="true"></i>Crear evento</button><div class="mini-calendar"><strong id="mini-title"></strong><div class="mini-weekdays" aria-hidden="true"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div><div id="mini-grid"></div></div><h2>Mis calendarios</h2><div class="calendar-filters"><label><input type="checkbox" value="academic" checked><span class="category-dot academic"></span>Universidad</label><label><input type="checkbox" value="personal" checked><span class="category-dot personal"></span>Personal</label><label><input type="checkbox" value="work" checked><span class="category-dot work"></span>Trabajo</label></div><div class="upcoming-card"><p class="eyebrow">PRÓXIMAMENTE</p><div id="calendar-upcoming"></div></div><p class="calendar-local-note"><i class="fa-solid fa-laptop" aria-hidden="true"></i>Eventos guardados en este navegador.</p></aside>
<main class="calendar-main"><div class="calendar-tools"><label class="search-field"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><input id="calendar-search" type="search" placeholder="Buscar un evento" aria-label="Buscar un evento"></label><span id="calendar-count"></span></div><div id="calendar-content"></div><p id="calendar-feedback" role="status" class="calendar-feedback"></p></main></div>
<dialog id="event-dialog" class="workspace-dialog"><form id="event-form"><div class="dialog-heading"><div><p class="eyebrow">TU AGENDA</p><h2 id="event-dialog-title">Nuevo evento</h2></div><button type="button" data-event-close class="icon-button" aria-label="Cerrar evento">×</button></div><label>Título<input name="event_title" id="event-title" placeholder="Añade un título" maxlength="140" required></label><label>Fecha<input name="event_date" id="event-date" type="date" required></label><label class="checkbox-label"><input name="allDay" id="event-all-day" type="checkbox">Todo el día</label><div class="form-row" id="event-hours"><label>Desde<input name="start" type="time" value="09:00" required></label><label>Hasta<input name="end" type="time" value="10:00" required></label></div><label>Calendario<select name="category"><option value="academic">Universidad</option><option value="personal">Personal</option><option value="work">Trabajo</option></select></label><label>Ubicación<input name="location" placeholder="Aula, oficina o enlace" maxlength="200"></label><label>Notas<textarea name="description" placeholder="Añade detalles para recordar" maxlength="2000" rows="3"></textarea></label><p id="event-error" class="form-error" role="alert"></p><div class="dialog-actions"><button type="button" id="event-delete" class="delete-event" hidden>Eliminar</button><button type="button" data-event-close class="secondary-button">Cancelar</button><button class="primary-button">Guardar evento</button></div></form></dialog>
</body></html>
