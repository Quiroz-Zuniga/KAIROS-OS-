<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="author" content="Rubén Quiroz"><title>UPHOS · Escritorio</title><link rel="icon" href="../assets/images/uphos-logo-transparent.png" type="image/png">
<script src="../js/preferences.js"></script><link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="../css/windows.css"><link rel="stylesheet" href="../css/template.css"><link rel="stylesheet" href="../css/uphos.css"><link rel="stylesheet" href="../css/desktop-panels.css"><link rel="stylesheet" href="../css/desktop.css"></head>
<body id="uph-desktop"><main><div id="desktop-surface" class="bg-cover bg-center h-screen relative overflow-hidden" style="background-image:url('../assets/images/uphos-wallpaper.svg')">
<header class="barra-superior"><div class="botones flex items-center"><img class="uph-logo uph-logo-bar" src="../assets/images/uphos-logo-transparent.png" alt="UPHOS"><button id="pantalla-completa" aria-label="Pantalla completa">⛶</button></div><div class="botones flex items-center"><span class="hora_actual"></span>
<button id="hardware-network" class="hardware-trigger" aria-label="Red simulada" aria-expanded="false"><i class="fa-solid fa-wifi"></i><span id="network-label">UPHOS</span></button><button id="hardware-audio" class="hardware-trigger" aria-label="Sonido simulado" aria-expanded="false"><i class="fa-solid fa-volume-high"></i><span id="audio-label">50%</span></button><button id="hardware-battery" class="hardware-trigger" aria-label="Batería simulada" aria-expanded="false"><i class="fa-solid fa-battery-full"></i><span id="battery-label">85%</span></button><button id="calendar" aria-label="Calendario">▦</button><button id="power-button" aria-label="Opciones de energía" aria-expanded="false">⏻</button></div></header>
<div id="desktop-icons" aria-label="Accesos del escritorio"></div>
<nav class="barra-tareas flex items-center" aria-label="Barra de aplicaciones"><button id="boton-inicio" class="button-barra-tareas uph-start" aria-label="Inicio UPHOS" aria-expanded="false"><img class="uph-logo" src="../assets/images/uphos-logo-transparent.png" alt=""></button><button class="button-barra-tareas" data-launch="google" aria-label="Búsqueda web">⌕</button><button class="button-barra-tareas" data-launch="imagenes" aria-label="Imágenes">▧</button><button class="button-barra-tareas" data-launch="editor" aria-label="Editor de texto">▤</button><button class="button-barra-tareas" data-launch="video" aria-label="Videos">▶</button><button class="button-barra-tareas" data-launch="calculator" aria-label="Calculadora">▦</button><button class="button-barra-tareas" data-launch="tasks" aria-label="Gestor de tareas">☷</button><button class="button-barra-tareas" data-launch="explorer" aria-label="Explorador de archivos">📁</button><button id="dock-options" class="dock-options" aria-label="Opciones de la barra de aplicaciones" aria-expanded="false">⋮</button></nav>
<section id="menu-inicio" class="desktop-popover" hidden aria-label="Inicio"><label for="app-search">Buscar aplicaciones</label><input id="app-search" type="search" placeholder="Escribe para buscar…"><div id="start-apps"></div><p id="app-empty" hidden>Sin aplicaciones coincidentes.</p><div class="start-footer"><button data-launch="procesos">Procesos</button><button id="start-power">⏻ Energía</button></div></section>
<div id="power-menu" class="desktop-popover" hidden aria-label="Energía"><button data-power="lock">Bloquear</button><button data-power="restart">Reiniciar</button><button data-power="sleep">Suspender</button><button data-power="off">Apagar</button></div>
<div id="dock-menu" class="desktop-popover" hidden><button id="dock-view-processes">Ver procesos</button></div>
<section id="hardware-panel" class="desktop-popover hardware-panel" aria-label="Dispositivos simulados" hidden><h2>Centro de control</h2><p class="hardware-source">Dispositivos virtuales de UPHOS</p><label>Sonido <input id="virtual-volume" type="range" min="0" max="100" value="50"></label><button id="virtual-mute">Silenciar</button><label><input id="virtual-wifi" type="checkbox" checked> Wi-Fi</label><p id="virtual-network">Conectado a UPHOS Campus</p><p>Batería virtual · 85%</p><progress max="100" value="85" aria-label="Batería virtual"></progress></section>
<div id="contextMenuEscritorio" class="desktop-popover" hidden aria-label="Opciones del escritorio"></div>
</div><div id="windowsContainer"></div><div id="restaurar-ventanas"></div><div id="uph-notice" role="status" hidden></div>
<dialog id="desktop-dialog"><form method="dialog"><h2 id="dialog-title"></h2><p id="dialog-detail"></p><label id="name-label">Nombre<input id="item-name" maxlength="100" required></label><p id="dialog-error" role="alert"></p><div class="dialog-actions"><button value="cancel" formnovalidate>Cancelar</button><button id="dialog-ok" value="ok">Aceptar</button></div></form></dialog>
<section id="session-screen" hidden><img class="uph-logo" src="../assets/images/uphos-logo-transparent.png" alt="UPHOS"><h1 id="session-title"></h1><p id="session-description"></p><button id="session-resume" class="uph-primary">Continuar</button></section>
</main><script type="module" src="../js/escritorio.js"></script></body></html>
