<!DOCTYPE html>
<html lang="es">
<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>KAIRÓS OS · Desbloqueo</title>
    <link rel="stylesheet" href="./resources/css/styles.css">

<body id="paginaDesbloqueo">
    <div class="bg-cover bg-center h-screen" style="background-image: url('./resources/assets/images/kairos-wallpaper.svg');">
        <div class="flex items-center " style="padding-top: 40px; padding-left: 20px;">
            <img src="./resources/assets/images/kairos-logo-transparent.png" alt="KAIRÓS OS" class="kairos-logo kairos-logo-lock" id="logo">
            
        </div>
        <div
            style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white;">

            <div class="text-4xl" id="fechaActual" style="margin-top: 10px;"></div><button id="desbloquear" class="kairos-primary" style="margin-top:24px">Entrar a KAIRÓS OS</button>
        </div>
    </div>
    <div
        style="position: fixed; bottom: 40px; left: 92.2%; transform: translateX(-50%); text-align: center; color: white;">
        <button class="px-2">
            <i class="fa-solid fa-wifi" role="img" aria-label="WiFi · indicador visual" title="WiFi · indicador visual"></i>
        </button>
        <button class="px-2">
            <i class="fa-solid fa-volume-high" role="img" aria-label="Sonido · indicador visual" title="Sonido · indicador visual"></i>
        </button>
        <button class="px-2">
            <i class="fa-solid fa-battery-full" role="img" aria-label="Batería · indicador visual" title="Batería · indicador visual"></i>
        </button>

     <script src="resources/js/fullscreen.js"></script>
